name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        
    - name: Fix and Setup Project
      run: |
        # حذف مجلد الأندرويد القديم وغير المتوافق
        rm -rf android
        
        # إعادة توليد هيكل أندرويد جديد ونظيف كلياً
        flutter create . --platforms=android --project-name notwin_ia
        
        # جلب الحزم وبناء التطبيق
        flutter pub get
        flutter build apk --release
      
    - uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
